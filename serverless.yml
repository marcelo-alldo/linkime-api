# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: alldo
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: alldo-assistente-api
# "service" is the name of this project. This will also be added to your AWS resource names.
service: alldo-assistente-api

plugins:
  - serverless-offline
  - serverless-prune-plugin

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${self:provider.stage}
    DATABASE_URL: ${self:custom.${self:provider.stage}.DATABASE_URL}
    JWT_SECRET: ${self:custom.${self:provider.stage}.JWT_SECRET}
    JWT_EXPIRES_IN: "365d"
    ROLE_USER_UID: ${self:custom.${self:provider.stage}.ROLE_USER_UID}
    SEND_EMAIL_QUEUE_URL: !GetAtt SendEmailQueue.QueueUrl
    BUCKET_NAME: ${self:custom.${self:provider.stage}.BUCKET_NAME}
    ALLDO_PAYMENTS_API_URL: ${self:custom.${self:provider.stage}.ALLDO_PAYMENTS_API_URL}
    ALLDO_PAYMENTS_ACCESS_TOKEN: ${self:custom.${self:provider.stage}.ALLDO_PAYMENTS_ACCESS_TOKEN}
    ALLDO_MAPS_ACCESS_TOKEN: ${self:custom.${self:provider.stage}.ALLDO_MAPS_ACCESS_TOKEN}
    ALLDO_N8N_ACCESS_TOKEN: ${self:custom.${self:provider.stage}.ALLDO_N8N_ACCESS_TOKEN}
    ALLDO_N8N_API_URL: ${self:custom.${self:provider.stage}.ALLDO_N8N_API_URL}
    ALLDO_N8N_USER: ${self:custom.${self:provider.stage}.ALLDO_N8N_USER}
    ALLDO_N8N_PASSWORD: ${self:custom.${self:provider.stage}.ALLDO_N8N_PASSWORD}
    FIREBASE_PROJECT_ID: ${self:custom.${self:provider.stage}.FIREBASE_PROJECT_ID}
    FIREBASE_CLIENT_EMAIL: ${self:custom.${self:provider.stage}.FIREBASE_CLIENT_EMAIL}
    SUBSCRIPTION_FREE_TRIAL_UID: ${self:custom.${self:provider.stage}.SUBSCRIPTION_FREE_TRIAL_UID}
    SUBSCRIPTION_DEFAULT_UID: ${self:custom.${self:provider.stage}.SUBSCRIPTION_DEFAULT_UID}
    SUBSCRIPTION_CUSTOM_UID: ${self:custom.${self:provider.stage}.SUBSCRIPTION_CUSTOM_UID}
    SUBSCRIPTION_SERVICE_UID: ${self:custom.${self:provider.stage}.SUBSCRIPTION_SERVICE_UID}
    ROLE_COLLABORATOR_UID: ${self:custom.${self:provider.stage}.ROLE_COLLABORATOR_UID}
    ALLDO_ASSISTENTE_BASE_URL: ${self:custom.${self:provider.stage}.ALLDO_ASSISTENTE_BASE_URL}
    ALLDO_ASSISTENTE_APIKEY: ${self:custom.${self:provider.stage}.ALLDO_ASSISTENTE_APIKEY}
    DISCORD_ALLDO_PENDING_WEBHOOK_URL: ${self:custom.${self:provider.stage}.DISCORD_ALLDO_PENDING_WEBHOOK_URL}
    WHATSAPP_URL: ${self:custom.${self:provider.stage}.WHATSAPP_URL}
    WHATSAPP_TOKEN: ${self:custom.${self:provider.stage}.WHATSAPP_TOKEN}
    WHATSAPP_APP_ID: ${self:custom.${self:provider.stage}.WHATSAPP_APP_ID}
    WHATSAPP_APP_SECRET: ${self:custom.${self:provider.stage}.WHATSAPP_APP_SECRET}
  vpc:
    securityGroupIds:
      - sg-0244f6e525b750262
    subnetIds:
      - subnet-0c76e439213802d98
      - subnet-07acb28908630dc76

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "lambda:InvokeFunction"
          Resource:
            - "arn:aws:lambda:us-east-1:522814713738:function:*"
        - Effect: Allow
          Action:
            - s3:*
          Resource: "arn:aws:s3:::*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - "arn:aws:sqs:us-east-1:*:*"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
            - ses:SendTemplatedEmail
          Resource: "*"

  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
      allowedMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - DELETE
      allowCredentials: false

package:
  individually: true
  patterns:
    - "!node_modules/.prisma/client/libquery_engine*"
    - "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node"
    - "node_modules/@prisma/engines/libquery_engine-rhel-openssl-3.0.x.so.node"
    - "features/emails/templates/**"
  exclude:
    - node_modules/**
    - .gitignore
    - .git/**
    - README.md
    - tests/**

